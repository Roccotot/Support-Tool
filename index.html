<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGRA FILM — Support Tool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
<!-- Leaflet è servito dal repo (cartella vendor/): niente dipendenze da CDN
     esterni, quindi l'app funziona anche senza internet e nessun codice di
     terze parti può cambiare sotto i piedi.
     ExcelJS (~900 KB) viene caricato solo al primo click su "Scarica Excel". -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="dati.js"></script>
<script src="basemap.js"></script>
<style>
:root {
  --bg:#07090e; --panel:#0c1018; --panel2:#101520; --panel3:#161d2b;
  --red:#e8192c; --green:#1db954; --blue:#1565c0;
  --accent:#2979ff; --lime:#00e676; --crimson:#ff1744; --amber:#ff9100;
  --text:#d8e8ff; --text2:#7a9bbf;
  --border:rgba(41,121,255,0.14); --border2:rgba(41,121,255,0.06);
  --glow:0 0 28px rgba(41,121,255,0.3);
  --rb:linear-gradient(90deg,#e8192c,#1db954,#1565c0);
  --col:640px;        /* larghezza della colonna centrale dei cinema */
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(232,25,44,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 100%,rgba(21,101,192,0.06) 0%,transparent 60%)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(41,121,255,0.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(41,121,255,0.022) 1px,transparent 1px);background-size:44px 44px}

/* La barra in alto scorre. Il gradiente si ripete ogni 600px invece di
   essere spalmato su tutto lo schermo: così il movimento si vede davvero
   (prima le tinte cambiavano troppo gradualmente per accorgersene).
   Con prefers-reduced-motion attivo si ferma (regola più sotto). */
.rb-bar{height:3px;flex-shrink:0;z-index:300;position:relative;
  background:repeating-linear-gradient(90deg,#e8192c 0,#1db954 200px,#1565c0 400px,#e8192c 600px);
  animation:rb-scorre 6s linear infinite}
@keyframes rb-scorre{from{background-position:0 0}to{background-position:600px 0}}

/* ── ACCESSIBILITÀ ── */
/* Navigazione da tastiera: prima il focus era invisibile ovunque tranne che
   sulla casella di ricerca. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ping-dot:focus-visible,.tc-ping:focus-visible{outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;scroll-behavior:auto !important}
}

/* ── HEADER ── */
header{position:relative;z-index:200;flex-shrink:0;background:rgba(7,9,14,0.97);
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);height:70px;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:14px}
.logo-wrap{display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo-wrap img{height:40px;width:auto;filter:drop-shadow(0 0 10px rgba(41,121,255,0.5))}
.logo-div{width:1px;height:28px;background:linear-gradient(180deg,transparent,rgba(41,121,255,0.5),transparent)}
.logo-text{font-family:'Share Tech Mono',monospace;font-size:10px;color:#c0d8f0;letter-spacing:2px;line-height:1.8;text-transform:uppercase}
.logo-text b{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.view-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;
  text-transform:uppercase;background:none;border:none;color:#c0d8f0;cursor:pointer;
  transition:all 0.2s;border-right:1px solid var(--border);position:relative}
.view-btn:last-child{border-right:none}
.view-btn svg{width:14px;height:14px;flex-shrink:0}
.view-btn:hover{color:var(--text);background:rgba(41,121,255,0.07)}
.view-btn.active{background:rgba(41,121,255,0.13);color:#fff}
.view-btn.active::after{content:'';position:absolute;bottom:0;left:6px;right:6px;
  height:2px;background:var(--rb);border-radius:2px 2px 0 0}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;position:relative}
.view.active{display:flex;flex-direction:column}
#view-cinema,#view-bytype{overflow-y:auto}
#view-cinema::-webkit-scrollbar,#view-bytype::-webkit-scrollbar{width:5px}
#view-cinema::-webkit-scrollbar-thumb,#view-bytype::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── INDICE CITTÀ ── */
/* Sta nella fascia vuota a sinistra della colonna centrale: sparisce da
   solo quando lo schermo non è abbastanza largo da contenerlo senza
   finire sopra le card. */
.side-index{position:fixed;left:16px;top:132px;max-height:calc(100vh - 154px);width:196px;z-index:120;
  display:flex;flex-direction:column;background:rgba(12,16,24,0.72);
  backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;
  padding:10px 6px 8px;overflow:hidden}
.ci-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text2);padding:2px 8px 8px;flex-shrink:0}
.ci-list{overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.ci-list::-webkit-scrollbar{width:4px}
.ci-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.ci-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  background:none;border:none;cursor:pointer;color:#c0d8f0;border-radius:7px;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.6px;
  padding:5px 8px;transition:background 0.15s,color 0.15s}
.ci-item:hover{background:rgba(41,121,255,0.12);color:#fff}
.ci-item.active{background:rgba(41,121,255,0.16);color:#fff}
.ci-item.active::before{content:'';position:absolute;left:0;width:3px;height:16px;
  background:var(--rb);border-radius:0 2px 2px 0}
.ci-item{position:relative}
.ci-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-count{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text2)}
.ci-item.hidden,.ci-sez.hidden{display:none}
.ci-sez{font-family:'Share Tech Mono',monospace;font-size:8.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--text2);padding:9px 8px 3px;opacity:.75}
.ci-sez:first-child{padding-top:2px}
.ci-item.ci-sotto{padding-left:16px;font-size:12.5px}
@media(max-width:1180px){.side-index{display:none}}

/* ── STATS ── */
/* Statistiche, barra di stato e intestazione stanno sulla stessa colonna
   centrale delle card: così la fascia di sinistra resta libera per
   l'indice delle città e niente ci finisce sotto. */
.stats-strip{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);
  gap:14px;padding:22px 28px 0;max-width:calc(var(--col) + 56px);margin:0 auto;width:100%}
.stat-tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px 20px;position:relative;overflow:hidden;animation:fadeUp 0.5s ease both}
.stat-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-tile:nth-child(1)::before{background:#1565c0}
.stat-tile:nth-child(2)::before{background:#1db954}
.stat-tile:nth-child(3)::before{background:var(--rb)}
.stat-tile:nth-child(1){animation-delay:.05s}.stat-tile:nth-child(2){animation-delay:.10s}.stat-tile:nth-child(3){animation-delay:.15s}
.st-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#c0d8f0;margin-bottom:7px}
.st-value{font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:700;line-height:1;color:var(--accent)}

/* ── MAIN ── */
.main{position:relative;z-index:1;padding:20px 28px 56px;max-width:calc(var(--col) + 56px);margin:0 auto;width:100%}
.section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border2)}
.section-title{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:#c0d8f0;text-transform:uppercase;white-space:nowrap}
#lastUpdate{color:#fff !important;font-size:11px;letter-spacing:1.5px}
.section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── CINEMA GRID ── */
/* Colonna unica centrata: i cinema stanno uno sotto l'altro, con le fasce
   laterali vuote. La larghezza è limitata apposta — più larga la card,
   più si allontanano i nomi dei modelli dagli IP e dai tasti a destra
   (a 640px restano ~280px di vuoto, a 760px diventano 400). */
.cinemas-grid{display:flex;flex-direction:column;gap:18px;
  max-width:var(--col);margin:0 auto;width:100%}
.city-col{display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:14px}
.city-col .cinema-cards{display:flex;flex-direction:column;gap:14px}
.city-col .cinema-cards .cinema-card{min-width:0}
.city-col-hdr{display:flex;align-items:center;gap:14px;padding:14px 4px 2px;scroll-margin-top:12px}
.city-col-hdr-line{flex:1;height:1px;background:var(--border)}
.city-col-hdr-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#c0d8f0;white-space:nowrap}
.city-divider{display:flex;align-items:center;gap:14px;padding:22px 4px 6px;margin-top:4px;grid-column:1/-1}
.city-divider-line{flex:1;height:1px;background:var(--border)}
.city-divider-label{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text2);white-space:nowrap}
.cinema-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;animation:fadeUp 0.6s ease both;transition:border-color 0.25s,box-shadow 0.25s,transform 0.2s}
.cinema-card:hover{border-color:rgba(41,121,255,0.4);box-shadow:0 8px 36px rgba(0,0,0,0.5),var(--glow);transform:translateY(-1px)}
.cinema-card:nth-child(1){animation-delay:.04s}.cinema-card:nth-child(2){animation-delay:.08s}
.cinema-card:nth-child(3){animation-delay:.12s}.cinema-card:nth-child(4){animation-delay:.16s}
.cinema-card:nth-child(5){animation-delay:.20s}.cinema-card:nth-child(6){animation-delay:.24s}
.cinema-card:nth-child(7){animation-delay:.28s}
.card-hdr{background:linear-gradient(135deg,var(--panel2),var(--panel3));padding:13px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;position:relative;overflow:hidden}
.card-hdr::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--rb);opacity:0.55}
.card-title-block{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.card-icon{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,0.1)}
.card-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1.5px;color:#fff;text-transform:uppercase;line-height:1.2}
.card-city{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;margin-top:2px}
.card-rtr{display:flex;align-items:center;gap:6px;margin-top:5px;
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:0.5px}
.card-rtr .ping-dot{width:7px;height:7px;flex-shrink:0;cursor:pointer}
@media(min-width:901px){.card-rtr{font-size:12px;margin-top:6px}.card-rtr .ping-dot{width:10px;height:10px}}
.card-actions{display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.tms-btn{font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid #00bcd455;color:#00bcd4;text-decoration:none;background:#00bcd410;transition:background .15s}
.tms-btn:hover{background:#00bcd430;color:#00e5ff}
.tag{font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;
  background:rgba(0,0,0,0.3);border:1px solid var(--border);color:#c0d8f0;white-space:nowrap}
.health{font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;
  white-space:nowrap;border:1px solid;display:none}
.health.ok{display:inline-block;color:var(--lime);border-color:rgba(0,230,118,0.35);background:rgba(0,230,118,0.07)}
.health.err{display:inline-block;color:var(--crimson);border-color:rgba(255,23,68,0.45);background:rgba(255,23,68,0.1)}
.chevron{width:16px;height:16px;color:#c0d8f0;transition:transform 0.3s;flex-shrink:0}
.cinema-card.collapsed .chevron{transform:rotate(-90deg)}
.card-body{overflow:hidden;max-height:2000px;transition:max-height 0.42s cubic-bezier(0.4,0,0.2,1)}
.cinema-card.collapsed .card-body{max-height:0}

/* ── ROOM SEPARATOR ── */
.room-sep{display:flex;align-items:center;gap:9px;padding:8px 16px 4px;margin-top:3px}
.room-sep-line{flex:1;height:1px;background:var(--border2)}
.room-sep-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:#fff;text-transform:uppercase;white-space:nowrap}
.room-sep-dot{width:5px;height:5px;border-radius:50%;opacity:0.6;flex-shrink:0}

/* ── DEVICE ROW ── */
.dev-row{display:flex;align-items:center;gap:10px;
  padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.15s}
.dev-row:last-child{border-bottom:none}
.dev-row:hover{background:rgba(41,121,255,0.04)}

/* ping dot */
.ping-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--text2);cursor:pointer;transition:all 0.3s;
  border:1px solid rgba(255,255,255,0.1)}
.ping-dot:hover{transform:scale(1.3)}
.ping-dot.ok{background:var(--lime);box-shadow:0 0 6px var(--lime);border-color:var(--lime);animation:blinkdot 1.5s infinite}
.ping-dot.err{background:var(--crimson);box-shadow:0 0 6px var(--crimson);border-color:var(--crimson);animation:blinkdot 1.5s infinite}
.ping-dot.checking{background:var(--amber);box-shadow:0 0 6px var(--amber);border-color:var(--amber);animation:blinkdot 0.5s infinite}
@keyframes blinkdot{0%,100%{opacity:1}50%{opacity:0.15}}

.dev-name{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dev-type{font-family:'Share Tech Mono',monospace;font-size:9px;padding:2px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.dev-type.proj{color:#b39ddb;border:1px solid rgba(179,157,219,0.3)}
.dev-type.srv{color:#90caf9;border:1px solid rgba(144,202,249,0.3)}
.dev-type.rtr{color:#ffb74d;border:1px solid rgba(255,183,77,0.3)}

/* ── DEVICE BUTTONS ── */
.dev-btns{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ip-btn{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--accent);
  padding:3px 9px;border-radius:3px;border:1px solid rgba(41,121,255,0.3);
  background:rgba(41,121,255,0.07);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.ip-btn:hover{color:#fff;background:rgba(41,121,255,0.2);border-color:var(--accent)}
.ip-btn.copied{color:var(--lime);border-color:rgba(0,230,118,0.4);background:rgba(0,230,118,0.09)}
.proto-btn{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.5px;
  padding:3px 7px;border-radius:3px;border:1px solid;cursor:pointer;
  transition:all 0.15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.proto-btn.web{color:#a5d6a7;border-color:rgba(165,214,167,0.3);background:rgba(165,214,167,0.07)}
.proto-btn.web:hover{background:rgba(165,214,167,0.2);border-color:#a5d6a7;color:#fff}
.proto-btn.ssh{color:#64b5f6;border-color:rgba(100,181,246,0.3);background:rgba(100,181,246,0.07)}
.proto-btn.ssh:hover{background:rgba(100,181,246,0.2);border-color:#64b5f6;color:#fff}
.proto-btn.vnc{color:#ffcc80;border-color:rgba(255,204,128,0.3);background:rgba(255,204,128,0.07)}
.proto-btn.vnc:hover{background:rgba(255,204,128,0.2);border-color:#ffcc80;color:#fff}

/* ── BY TYPE VIEW ── */
.type-section{margin-bottom:30px}
.type-hdr{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border2)}
.type-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.type-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:2px;text-transform:uppercase}
.type-count{font-family:'Share Tech Mono',monospace;font-size:10px;color:#c0d8f0;letter-spacing:1px;margin-left:auto}
.type-grid{display:grid;grid-template-columns:1fr;gap:10px}
.type-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;transition:border-color 0.2s,box-shadow 0.2s,transform 0.15s;animation:fadeUp 0.4s ease both}
.type-card:hover{border-color:rgba(41,121,255,0.4);box-shadow:0 4px 18px rgba(0,0,0,0.4);transform:translateY(-1px)}
.tc-cinema{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1.5px;color:#c0d8f0;text-transform:uppercase;margin-bottom:4px}
.tc-name{font-size:12px;color:var(--text);font-weight:600;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-btns{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tc-ping{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text2);
  cursor:pointer;transition:all 0.3s;border:1px solid rgba(255,255,255,0.1);margin-right:2px}
.tc-ping:hover{transform:scale(1.3)}
.tc-ping.ok{background:var(--lime);box-shadow:0 0 5px var(--lime);border-color:var(--lime);animation:blinkdot 1.5s infinite}
.tc-ping.err{background:var(--crimson);box-shadow:0 0 5px var(--crimson);animation:blinkdot 1.5s infinite}
.tc-ping.checking{background:var(--amber);box-shadow:0 0 5px var(--amber);animation:blinkdot 0.5s infinite}
.model-group-header{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:0;cursor:pointer;user-select:none}
.model-group-header:hover .mgh-label{color:#fff}
.model-group-header .mgh-line{flex:1;height:1px;background:rgba(255,255,255,0.08)}
/* La foto del modello era tarata sulla griglia larga: nella colonna da
   640px si prendeva un terzo della riga. */
.model-group-header .mgh-img{width:132px;height:84px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.04);flex-shrink:0;padding:4px}
.model-group-header .mgh-img.white-bg{background:#fff}
.model-group-header .mgh-label{font-family:'Share Tech Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;color:#c0d8f0;white-space:nowrap;text-transform:uppercase;transition:color .15s}
.model-group-header .mgh-count{font-size:9px;color:var(--text2);background:rgba(255,255,255,0.06);border-radius:10px;padding:1px 8px;letter-spacing:.5px}
.model-group-header .mgh-chevron{font-size:10px;color:var(--text2);transition:transform .2s;flex-shrink:0}
.model-group-header{scroll-margin-top:14px}
.model-group-header.collapsed .mgh-chevron{transform:rotate(-90deg)}
.model-group-header.collapsed .mgh-img{display:none}
/* Un dispositivo per riga, come nella vista Cinema */
.model-group-cards{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:10px;overflow:hidden;transition:opacity .2s}
.model-group-cards.hidden{display:none}
/* .hidden = nascosto dalla ricerca, .filtered-out = gruppo rimasto vuoto */
.cinema-card.hidden,.city-col.hidden,.type-card.hidden,
.model-group-cards.filtered-out,.model-group-header.filtered-out{display:none}

/* ── MAP ── */
#view-mappa{position:relative}
.map-container{position:absolute;inset:0;display:none;z-index:1}
.map-container.active{display:block}
.leaflet-container{background:#07090e !important}
.map-stats-bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;gap:12px;align-items:center;background:rgba(7,9,14,0.93);
  border:1px solid var(--border);border-radius:30px;padding:9px 22px;
  backdrop-filter:blur(14px);pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.msb-item{font-family:'Share Tech Mono',monospace;font-size:11px;color:#c0d8f0;letter-spacing:1px}
.msb-legend{color:var(--text2);letter-spacing:0.5px}
.msb-item span{font-weight:700;margin-left:4px;color:var(--accent)}
.msb-sep{color:rgba(255,255,255,0.1)}
.cmarker{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2.5px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
/* Sfondo di riserva (OpenStreetMap): reso scuro per non spaccare il tema */
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(0.72) contrast(1.12) saturate(0.6)}
.leaflet-control-attribution{background:rgba(7,9,14,0.7) !important;color:#5c7796 !important;
  font-size:9px !important;padding:1px 6px !important;border-radius:4px 0 0 0}
.leaflet-control-attribution a{color:#7a9bbf !important}
.cmarker-inner{transform:rotate(45deg);display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:15px}
.cmarker-status{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;
  background:rgba(122,155,191,0.35);border:2px solid rgba(7,9,14,0.9);
  transform:rotate(45deg);z-index:10;transition:background 0.3s,box-shadow 0.3s}
.cmarker-status.ok{background:#00e676;box-shadow:0 0 7px #00e676;animation:blinkdot 1.5s infinite}
.cmarker-status.err{background:#ff1744;box-shadow:0 0 7px #ff1744;animation:blinkdot 1.5s infinite}
.cmarker-status.partial{background:#ff9100;box-shadow:0 0 7px #ff9100}
.leaflet-popup-content-wrapper{background:rgba(7,9,14,0.97) !important;border:1px solid rgba(41,121,255,0.3) !important;
  border-radius:13px !important;box-shadow:0 12px 48px rgba(0,0,0,0.8),0 0 24px rgba(41,121,255,0.15) !important;
  padding:0 !important;min-width:300px;max-width:380px;overflow:hidden}
.leaflet-popup-tip-container{display:none !important}
.leaflet-popup-close-button{color:var(--text2) !important;font-size:18px !important;top:10px !important;right:10px !important;z-index:10}
.leaflet-popup-close-button:hover{color:#fff !important}
.leaflet-popup-content{margin:0 !important;width:100% !important}
.popup-rb{height:3px}
.popup-hdr{padding:12px 15px 10px;border-bottom:1px solid rgba(41,121,255,0.1);display:flex;align-items:flex-start;gap:11px}
.popup-ico{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,0.1)}
.popup-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1.5px;color:#fff;text-transform:uppercase;line-height:1.2}
.popup-city{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;margin-top:3px}
.popup-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.pbadge{font-family:'Share Tech Mono',monospace;font-size:9px;border-radius:3px;padding:2px 7px;border:1px solid;white-space:nowrap;text-decoration:none;display:inline-block}
.popup-room-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#ffe066;letter-spacing:2px;text-transform:uppercase;padding:6px 15px 3px;border-top:1px solid rgba(41,121,255,0.06);margin-top:2px}
.popup-devs{padding:2px 0;max-height:230px;overflow-y:auto}
.popup-devs::-webkit-scrollbar{width:3px}
.popup-devs::-webkit-scrollbar-thumb{background:rgba(41,121,255,0.2);border-radius:2px}
.popup-dev-row{display:flex;align-items:center;gap:8px;padding:5px 15px;transition:background 0.12s}
.popup-dev-row:hover{background:rgba(41,121,255,0.05)}
.pdev-name{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pdev-btns{display:flex;gap:4px;flex-shrink:0}
.pdev-btns .proto-btn{font-size:8px}
.pdev-btns .ip-btn{font-size:9px;padding:2px 6px}
.cinema-tooltip .leaflet-tooltip{background:transparent !important;border:none !important;box-shadow:none !important}


/* ── TOAST ── */
.toast{position:fixed;bottom:50px;right:20px;z-index:9999;background:var(--panel2);
  border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;
  padding:11px 17px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);
  opacity:0;transform:translateX(20px);transition:all 0.3s;pointer-events:none;
  max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.toast.show{opacity:1;transform:translateX(0)}
.toast-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.toast-title.ok{color:var(--lime)}.toast-title.err{color:var(--crimson)}.toast-title.info{color:var(--accent)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:901px){
  .card-name{font-size:22px}
  .card-city{font-size:14px}
  .room-sep-label{font-size:13px;letter-spacing:2.5px}
  .dev-name{font-size:17px}
  .dev-type{font-size:13px;padding:4px 12px}
  .city-divider-label{font-size:20px}
  .tag,.health{font-size:13px;padding:5px 13px}
  .ip-btn{font-size:13px;padding:4px 10px}
  .proto-btn{font-size:12px;padding:4px 10px;letter-spacing:0.5px}
  .dev-btns{gap:6px}
  .dev-row{gap:13px;padding:8px 18px}
  .ping-dot{width:11px;height:11px}
  .chevron{width:20px;height:20px}
  .action-btn{font-size:14px;padding:8px 20px}
  .section-title{font-size:15px;letter-spacing:2px}
}
@media(max-width:900px){
  .stats-strip{grid-template-columns:repeat(3,1fr);padding:12px}
  .main{padding:12px 12px 56px}
  .cinemas-grid{max-width:none}
  .stats-strip,.global-status-bar,.main{max-width:1600px}
  header{padding:0 12px}
}
/* ── SEARCH ── */
.search-input{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:7px 13px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);
  width:230px;outline:none;transition:all 0.2s}
.search-input::placeholder{color:var(--text2)}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap .search-input{padding-right:26px}
.search-clear{display:none;position:absolute;right:6px;background:none;border:none;cursor:pointer;
  color:var(--text2);font-size:12px;line-height:1;padding:3px 4px;border-radius:4px}
.search-clear:hover{color:var(--text);background:rgba(41,121,255,0.12)}
.search-clear.show{display:block}
.action-btn.busy{opacity:.55;pointer-events:none}
.search-input:focus{border-color:rgba(41,121,255,0.5);box-shadow:var(--glow)}
/* ── GLOBAL STATUS BAR ── */
.global-status-bar{position:relative;z-index:1;display:flex;align-items:center;gap:10px;
  padding:10px 28px 0;max-width:calc(var(--col) + 56px);margin:0 auto;width:100%;flex-wrap:wrap}
.gs-item{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);
  display:inline-flex;align-items:center;gap:5px}
.gs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.gs-dot.ok{background:var(--lime);box-shadow:0 0 4px var(--lime)}
.gs-dot.err{background:var(--crimson);box-shadow:0 0 4px var(--crimson)}
.gs-toggle{background:none;border:1px solid transparent;border-radius:6px;padding:2px 7px;margin:0 -7px;
  cursor:pointer;transition:all 0.2s}
.gs-toggle:hover{color:var(--text);border-color:rgba(255,23,68,0.4)}
.gs-toggle[aria-pressed="true"]{color:#fff;border-color:var(--crimson);background:rgba(255,23,68,0.14)}
.gs-sep{color:rgba(255,255,255,0.12);font-family:'Share Tech Mono',monospace;font-size:10px}
.gs-spacer{flex:1}
.action-btn{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;
  padding:5px 13px;border-radius:6px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);cursor:pointer;transition:all 0.2s;text-transform:uppercase}
.action-btn.refresh:hover{border-color:rgba(41,121,255,0.5);color:#fff;background:rgba(41,121,255,0.1)}
.action-btn.export:hover{border-color:rgba(0,230,118,0.4);color:var(--lime);background:rgba(0,230,118,0.07)}
.action-btn:disabled{opacity:0.5;cursor:not-allowed}
.no-results{grid-column:1/-1;text-align:center;padding:40px 20px;
  font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);display:none}
@media(max-width:900px){.global-status-bar{padding:8px 12px 0}.map-stats-bar{display:none}}
/* ── BOTTONE CICLO VISTE (mobile) ── */
.view-cycle-btn{display:none;align-items:center;gap:6px;padding:9px 13px;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;
  text-transform:uppercase;background:var(--panel);border:1px solid var(--border);
  border-radius:9px;color:#c0d8f0;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.view-cycle-btn:hover{color:#fff;background:rgba(41,121,255,0.09)}
.view-cycle-btn:active{background:rgba(41,121,255,0.18)}
@media(max-width:600px){.logo-text,.logo-div{display:none}.search-input{width:130px}
  .view-toggle{display:none}.view-cycle-btn{display:flex}}
/* Su schermo stretto i cinque filtri non ci stanno in fila: vanno a capo
   invece di uscire dallo schermo (prima "AL CHIUSO" era tagliato e
   "TUTTI" irraggiungibile). */
@media(max-width:760px){
  .cinema-filter-bar{flex-wrap:wrap;padding:8px 12px;gap:6px}
  .cf-btn{padding:5px 11px;letter-spacing:1.5px}
  .map-filter-bar{flex-wrap:wrap;max-width:calc(100vw - 24px)}
  /* titolo e data della sezione vanno a capo invece di uscire a destra */
  .section-hdr{flex-wrap:wrap;gap:6px}
  .section-line{min-width:20px}
}
@media(max-width:420px){
  header{padding:0 8px;gap:8px}
  .logo-wrap img{height:30px}
  .search-input{width:80px;padding:6px 8px;font-size:10px}
  .view-cycle-btn{padding:6px 9px;font-size:11px;gap:4px}
  .view-cycle-btn svg:last-child{display:none}
}

.proto-btn.tms-web{color:#4dd0e1;border-color:rgba(77,208,225,0.3);background:rgba(77,208,225,0.07)}
.proto-btn.tms-web:hover{background:rgba(77,208,225,0.2);border-color:#4dd0e1;color:#fff}

/* ── CINEMA FILTER BAR ── */
.cinema-filter-bar{position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:8px;
  padding:10px 28px;
  background:rgba(7,9,14,0.97);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border2);width:100%}
.cf-btn{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:5px 16px;border-radius:6px;border:1px solid var(--border);background:var(--panel);
  color:var(--text2);cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.cf-btn:hover{color:var(--text);border-color:rgba(41,121,255,0.4)}
.cf-btn.active{color:#fff;border-color:var(--accent);background:rgba(41,121,255,0.15)}

/* ── MAP FILTER BAR ── */
.map-filter-bar{position:absolute;top:16px;right:16px;z-index:200;display:flex;gap:6px}
.mf-btn{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:5px 14px;border-radius:6px;border:1px solid var(--border);
  background:rgba(7,9,14,0.93);backdrop-filter:blur(14px);
  color:var(--text2);cursor:pointer;transition:all 0.2s}
.mf-btn:hover{color:var(--text);border-color:rgba(41,121,255,0.4)}
.mf-btn.active{color:#fff;border-color:var(--accent);background:rgba(41,121,255,0.2)}
</style>

<script>
// ── DATI ─────────────────────────────────────────────────────
const RAW        = SIGRA_RAW.vpn;

const RAW_NOVPN  = SIGRA_RAW.offline;

const RAW_ESTIVI = SIGRA_RAW.estivi;

// ── COLORI ────────────────────────────────────────────────────
// Una famiglia di tinta per rete — blu VPN, viola rete locale, ambra
// estivi — e dentro la famiglia una sfumatura diversa per ogni cinema
// della stessa città, così due card vicine non si confondono mai.
// Verde, rosso e arancio restano liberi: sono lo stato dei ping, e un
// cinema colorato di rosso si leggerebbe come "tutto giù".
const FAMIGLIE = {
  vpn:     {h: 252, L: 0.76},   // blu
  offline: {h: 322, L: 0.73},   // viola
  estivi:  {h: 80,  L: 0.83},   // ambra
};
// Ventaglio di tonalità e luminosità dentro la famiglia: 7 × 5 = 35
// combinazioni prima di ripetersi, più di quante ne servano in una città.
const D_TINTA = [0, 20, -20, 38, -38, 10, -10];
const D_LUCE  = [0, -0.06, 0.05, -0.03, 0.03];
const CROMA   = 0.145;

// OKLCH → hex. Lavorare in OKLCH serve perché a parità di L tutte le
// tinte hanno la stessa luminosità percepita: nella vecchia palette
// variava del 34% e alcune tinte sembravano sbiadite accanto ad altre.
// Se il colore esce dal gamut sRGB si abbassa solo il croma: tinta e
// luminosità restano quelle chieste.
function oklchHex(L, C, H) {
  const gamma = x => (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1/2.4) - 0.055);
  for (let c = C; ; c -= 0.004) {
    const rad = H * Math.PI / 180, a = c * Math.cos(rad), b = c * Math.sin(rad);
    const l_ = L + 0.3963377774*a + 0.2158037573*b;
    const m_ = L - 0.1055613458*a - 0.0638541728*b;
    const s_ = L - 0.0894841775*a - 1.2914855480*b;
    const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
    const rgb = [ 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
                 -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
                 -0.0041960863*l - 0.7034186147*m + 1.7076147010*s];
    if (c <= 0.004 || rgb.every(v => v >= -0.001 && v <= 1.001)) {
      return '#' + rgb.map(v =>
        Math.round(Math.min(1, Math.max(0, gamma(v))) * 255).toString(16).padStart(2, '0')).join('');
    }
  }
}

const _colorMap = {};

function initColors(cinemas) {
  Object.keys(_colorMap).forEach(k => delete _colorMap[k]);
  const conta = {};
  cinemas.forEach(c => {
    // Chiave nome+città: esistono cinema omonimi in città diverse.
    const k = c.name + '|' + c.city;
    if (_colorMap[k]) return;
    const fam = FAMIGLIE[c.net] || FAMIGLIE.vpn;
    const gruppo = c.net + '|' + c.city;          // sfumature per città
    const i = conta[gruppo] = (conta[gruppo] === undefined ? 0 : conta[gruppo] + 1);
    _colorMap[k] = oklchHex(fam.L + D_LUCE[i % D_LUCE.length], CROMA,
                            fam.h + D_TINTA[i % D_TINTA.length]);
  });
}

function cinemaColor(name, city) {
  return _colorMap[name + '|' + city] || '#2979ff';
}

// ── PARSE ─────────────────────────────────────────────────────
// Escape per interpolazioni in innerHTML / attributi
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const IP_RE = /^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/;

// ── IDENTITÀ ──────────────────────────────────────────────────
// Un cinema non è identificato dal solo nome: ci sono omonimi in città
// diverse (Italia a Soci e a Castellina in Chianti, Puccini ad Altopascio e
// a Fornaci di Barga, Cinema Castello a Firenze e a Castiglione della
// Pescaia...). Chiave = nome + città, sempre.
// La rete fa parte della chiave: lo stesso cinema può comparire in due
// blocchi dati (Flora a Firenze è sia in VPN sia fra gli offline), e i due
// elenchi di dispositivi non vanno mescolati.
function cinemaKey(c) { return c.name + '|' + c.city + (c.net ? '|' + c.net : ''); }

// Un dispositivo non è identificato dal solo IP: le reti locali dei cinema
// offline ed estivi riusano gli stessi indirizzi ovunque (192.168.1.10
// compare in 77 cinema diversi). Chiave = cinema + città + IP, altrimenti
// un ping colora i pallini di decine di cinema sbagliati.
function devKey(c, ip) { return cinemaKey(c) + '|' + ip; }

// Porta su cui ha senso tentare il probe HTTP: i TMS espongono la loro UI
// sulla 9000, tutto il resto sulla 80.
function probePort(label) { return devType(label)[0] === 'tms' ? '9000' : ''; }

function parseRaw(raw, net) {
  const cinemas = {};
  // Firme già viste: una riga incollata due volte (stesso cinema, stessa
  // sala, stesso dispositivo, stesso IP) sdoppiava tutto in card, popup e
  // contatori senza che nulla lo segnalasse.
  const visti = new Set();
  raw.split('\n').forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('//')) return;
    const cols = line.split('\t');
    // Riga coordinate: "Nome - Città - Coord\tlat,lng\tGEO"
    if (cols[2] === 'GEO') {
      const parts = cols[0].split(' - ');
      if (parts.length < 2) return;
      const name = parts[0].trim();
      const city = parts[1].trim().replace(/\s*-\s*[A-Z]{2}$/,'').trim();
      const key  = name + '|||' + city;
      if (!cinemas[key]) cinemas[key] = { name, city, net, rooms:{} };
      const [lat, lng] = (cols[1]||'').split(',').map(Number);
      if (isNaN(lat) || isNaN(lng)) return;
      const prec = cinemas[key].coords;
      if (prec && (prec[0] !== lat || prec[1] !== lng)) {
        console.warn(`parseRaw: ${name} (${city}) ha due righe GEO diverse, ` +
          `vince l'ultima: ${prec} → ${[lat, lng]}`);
      }
      cinemas[key].coords = [lat, lng];
      return;
    }
    if (!IP_RE.test((cols[1]||'').trim())) {
      console.warn('parseRaw: riga ignorata (manca IP):', line);
      return;
    }
    const full   = cols[0];
    const ipPort = cols[1].trim();
    const ip     = ipPort.replace(/:\d+$/,'');
    // La porta scritta nei dati è quella del monitoraggio SNMP (161/UDP):
    // la conserviamo solo come informazione, non ci si può fare un probe HTTP.
    const snmpPort = (ipPort.match(/:(\d+)$/) || [])[1] || '';
    const parts = full.split(' - ');
    if (parts.length < 2) return;
    const name = parts[0].trim();
    const city = parts[1].trim().replace(/\s*-\s*[A-Z]{2}$/,'').trim();
    const room = (parts[2] ? parts[2].trim() : 'Dispositivi').replace(/^(Sala)\s+0*(\d+)$/, '$1 $2');
    const dev  = parts.slice(3).join(' - ').trim() || 'Unità';
    const key  = name + '|||' + city;
    const firma = key + '|||' + room + '|||' + dev + '|||' + ip;
    if (visti.has(firma)) {
      console.warn('parseRaw: riga duplicata, ignorata:', line);
      return;
    }
    visti.add(firma);
    if (!cinemas[key]) cinemas[key] = { name, city, net, rooms:{} };
    if (!cinemas[key].rooms[room]) cinemas[key].rooms[room] = [];
    cinemas[key].rooms[room].push({ label:dev, ip, snmpPort, cinema:name, city });
  });
  const result = Object.values(cinemas).sort((a,b) => a.city.localeCompare(b.city));
  result.forEach(c => Object.keys(c.rooms).forEach(r => {
    c.rooms[r].sort((a,b) => {
      const ta = devType(a.label)[0], tb = devType(b.label)[0];
      const TYPE_ORDER = {proj:0,srv:1,aud:2,pc:3,tms:4,rtr:5};
      const oa = TYPE_ORDER[ta]??9, ob = TYPE_ORDER[tb]??9;
      if (oa !== ob) return oa - ob;
      if (ta === 'proj') return modelYear(a.label) - modelYear(b.label);
      return 0;
    });
  }));
  return result;
}

function devType(label) {
  if (/mikrotik|router/i.test(label))                          return ['rtr','ROUTER'];
  if (/\btms\b/i.test(label))                                  return ['tms','TMS'];
  if (/\bpc\b/i.test(label))                                   return ['pc','PC'];
  if (/server|ims3000|dcp2000|cinecloud|doremi|qube|srv|showvault|alchemy|\bicmp\b|\bimb\b/i.test(label)) return ['srv','SERVER'];
  if (/proiettore|barco|christie|nec|projector|dp2k|sp2k|dp4k|sp4k|cinemeccanica|dpc-/i.test(label)) return ['proj','PROIETT.'];
  if (/processore audio|mixer|dolby|jbl|cp[0-9]|cpi[0-9]/i.test(label)) return ['aud','AUDIO'];
  return ['proj','UNITÀ'];
}

// Anno di lancio commerciale per ogni modello — usato per ordinare "per tipo" e nelle sale
// Fonte: press release CinemaCon / NAB / IBC / produttori
const MODEL_YEAR = {
  // ── AUDIO PROCESSORS ─────────────────────────────────────────
  'cp55':      1986,
  'cp650':     2002,
  'cp65':      1991,
  'cp45':      1996,
  'cp500':     1998,
  'cp750':     2009,
  'cp850':     2012,
  'cpi2000':   2018,
  'cp950':     2019,
  // ── SERVER / MEDIA BLOCK ─────────────────────────────────────
  'dcp-2000':  2005,  'dcp2000':  2005,   // Doremi DCP-2000
  'dcp-2k4':   2008,  'dcp2k4':   2008,   // Doremi DCP-2K4
  'qube xp-d': 2012,  // Qube XP-D DCI server Series 2
  'qube':      2005,
  'showvault': 2011,
  'cinecloud': 2013,
  'icmp':      2014,  // Barco ICMP / Alchemy
  'ims3000':   2017,  // Dolby IMS3000
  'imb-s4':    2024,  // Christie IMB-S4
  // ── PROJECTORS ───────────────────────────────────────────────
  'cmc4':      2006,  // Cinemeccanica CMC4 D2
  'nc2000':    2008,  // NEC NC2000C (DCI cert. 2008)
  'dp-2000':   2008,  'dp2000':   2008,  // Barco DP-2000
  'dpc-80':    2010,  'dpc80':    2010,  // Cinemeccanica DPC-80
  'cp2210':    2010,  // Christie CP2210
  'dp2k-19b':  2012,  'dp4k-19b': 2012,
  'dp2k-20c':  2013,  'dp2k-15c': 2013, 'dp2k-12c': 2013,
  'dp2k-10s':  2013,  'dp2k-8s':  2013,
  'dp2k-6e':   2015,
  'sp4k-':     2019,  // Barco Series 4 (laser) — SP4K-B
  'sp2k-':     2020,  // Cinionic SP2K Series 4 — SP2K-11S/9S/7S
  'cp2406':    2024,  // Christie CineLife+ RBe
  'cp2409':    2024,
  'cp2411':    2024,
};
// Chiavi ordinate per lunghezza decrescente: la chiave più specifica vince
// (es. 'cp650' deve essere testata prima di 'cp65', che ne è substring)
const MODEL_YEAR_KEYS = Object.keys(MODEL_YEAR).sort((a,b) => b.length - a.length);
function modelYear(label) {
  const l = label.toLowerCase();
  for (const k of MODEL_YEAR_KEYS) if (l.includes(k)) return MODEL_YEAR[k];
  return 9999;
}

const MODEL_IMG = {
  mikrotik: 'img/mikrotik.png',
  cmc4:     'img/cmc4.jpg',
  dp4k:     'img/dp4k.jpg',
  icmp:     'img/icmp.jpg',
  sp2k:     'img/sp2k.jpg',
  sp_b:     'img/sp_b.png',
  sp_c:     'img/sp_c.png',
  dp2k_c:   'img/dp2k_c.jpg',
  dp2k_s:   'img/dp2k_s.jpg',
  dp2k_e:   'img/dp2k_e.jpg',
  dp2000:   'img/dp2000.jpg',
  ims3000:  'img/ims3000.jpg',
  cinecloud: 'img/cinecloud.jpg',
  cp45:      'img/cp45.jpg',
  christie:    'img/christie.jpg',
  cp2406rbe:   'img/cp2406rbe.png',
  cp2411rbe:   'img/cp2411rbe.png',
  imbs4:       'img/imbs4.png',
  nec_nc2000c: 'img/nec_nc2000c.jpg',
  dpc80:    'img/dpc80.jpg',
  dcp2000:  'img/dcp2000.png',
  dcp2k4:   'img/dcp2k4.png',
  showvault:'img/showvault.jpg',
  cp55:     'img/cp55.jpg',
  cp65:     'img/cp65.webp',
  cp500:    'img/cp500.jpg',
  cp650:    'img/cp650.png',
  cp750:    'img/cp750.jpg',
  cp850:    'img/cp850.jpg',
  cp950:    'img/cp950.jpg',
  cpi2000:  'img/cpi2000.jpg',
};

function getModelImage(label) {
  const l = label.toLowerCase();
  if (/mikrotik|router/i.test(l))   return MODEL_IMG.mikrotik;
  if (/cmc4/.test(l))               return MODEL_IMG.cmc4;
  if (/dp4k/.test(l))               return MODEL_IMG.dp4k;
  if (/sp4k-\d+b\b|sp2k-\d+b\b/.test(l)) return MODEL_IMG.sp_b;
  if (/sp4k-\d+c\b|sp2k-\d+c\b/.test(l)) return MODEL_IMG.sp_c;
  if (/sp2k/.test(l))               return MODEL_IMG.sp2k;
  if (/dp2k-\d+c\b/.test(l))       return MODEL_IMG.dp2k_c;
  if (/dp2k-\d+e\b/.test(l))       return MODEL_IMG.dp2k_e;
  if (/dp2k-\d+b\b/.test(l))       return MODEL_IMG.dp4k;
  if (/dp2k-\d+s[a-z]*/i.test(l))  return MODEL_IMG.dp2k_s;
  if (/dp[-\s]?2000/.test(l))      return MODEL_IMG.dp2000;
  if (/\bicmp\b/.test(l))           return MODEL_IMG.icmp;
  if (/ims3000/.test(l))            return MODEL_IMG.ims3000;
  if (/cinecloud/.test(l))          return MODEL_IMG.cinecloud;
  if (/cp2411-?rbe/i.test(l))        return MODEL_IMG.cp2411rbe;
  // CP2406 e CP2409 condividono lo stesso chassis: stessa foto
  if (/cp240[69]-?rbe/i.test(l))     return MODEL_IMG.cp2406rbe;
  if (/imb-?s4/i.test(l))            return MODEL_IMG.imbs4;
  if (/christie|cp2210/i.test(l))    return MODEL_IMG.christie;
  if (/nec|nc2000/i.test(l))        return MODEL_IMG.nec_nc2000c;
  if (/dpc-?80/.test(l))            return MODEL_IMG.dpc80;
  if (/dcp-?2k4/i.test(l))          return MODEL_IMG.dcp2k4;
  if (/dcp2000/.test(l))            return MODEL_IMG.dcp2000;
  if (/showvault/.test(l))          return MODEL_IMG.showvault;
  if (/cp45\b/.test(l))             return MODEL_IMG.cp45;
  if (/cp950/.test(l))              return MODEL_IMG.cp950;
  if (/cp850/.test(l))              return MODEL_IMG.cp850;
  if (/cp750/.test(l))              return MODEL_IMG.cp750;
  if (/cp650/.test(l))              return MODEL_IMG.cp650;
  if (/cp500\b/.test(l))            return MODEL_IMG.cp500;
  if (/cp65\b/.test(l))             return MODEL_IMG.cp65;
  if (/cp55\b/.test(l))             return MODEL_IMG.cp55;
  if (/cpi2000/.test(l))            return MODEL_IMG.cpi2000;
  return null;
}

// ── DATI PARSATI (una volta sola, all'avvio) ─────────────────
const DATA = {
  vpn:     parseRaw(RAW,        'vpn'),
  offline: parseRaw(RAW_NOVPN,  'offline'),
  estivi:  parseRaw(RAW_ESTIVI, 'estivi'),
};
const ALL_CINEMAS = [...DATA.vpn, ...DATA.offline, ...DATA.estivi];
// I colori si assegnano una volta sola su tutti i cinema: così lo stesso
// cinema ha lo stesso colore in vista Cinema, Per tipo e Mappa.
initColors(ALL_CINEMAS);
// Dispositivi dei cinema VPN: base del contatore globale online/offline
const VPN_KEYS = new Set(
  DATA.vpn.flatMap(c => Object.values(c.rooms).flat().map(d => devKey(c, d.ip)))
);

// ── PING ─────────────────────────────────────────────────────
const pingState = {};   // chiave dispositivo → 'ok' | 'err' | 'checking'
const pingMs    = {};   // chiave dispositivo → latenza dell'ultima risposta

function updateGlobalStatus() {
  // Conta solo i dispositivi dei cinema VPN: pingState può contenere anche
  // dispositivi pingati a mano nelle viste estivi/tutti
  let online = 0, offline = 0, checking = 0;
  VPN_KEYS.forEach(k => {
    const s = pingState[k];
    if (s === 'ok') online++;
    else if (s === 'err') offline++;
    else if (s === 'checking') checking++;
  });
  const unknown = VPN_KEYS.size - online - offline - checking;
  const onEl  = document.getElementById('gs-online-count');
  const offEl = document.getElementById('gs-offline-count');
  const unkEl = document.getElementById('gs-unknown-count');
  if(onEl)  onEl.textContent  = online;
  if(offEl) offEl.textContent = offline;
  if(unkEl) unkEl.textContent = unknown;
}

// Applica uno stato a tutti i pallini dello stesso dispositivo (lo stesso
// dispositivo compare nella card, nell'header del cinema, nel popup mappa e
// nella vista Per tipo): la chiave è cinema+IP, non l'IP.
function setDotState(pk, state, title) {
  document.querySelectorAll(`[data-pk="${CSS.escape(pk)}"]`).forEach(d => {
    d.classList.remove('ok','err','checking');
    if (state) d.classList.add(state);
    if (title) d.title = title;
  });
}

const PING_TIMEOUT = 3000;

async function pingDevice(pk, ip, port) {
  if (!pk || !ip) return false;
  const prev = pingState[pk];
  pingState[pk] = 'checking';
  updateGlobalStatus();
  setDotState(pk, 'checking', 'Verifica in corso…');
  const t0 = performance.now();
  const ok = await new Promise(res => {
    const c = new AbortController();
    const t = setTimeout(() => { c.abort(); res(false); }, PING_TIMEOUT);
    const path = port == 9000 ? '/?redirect=/tms/' : '';
    fetch('http://' + ip + (port ? ':' + port : '') + path, { signal:c.signal, mode:'no-cors', cache:'no-store' })
      .then(() => { clearTimeout(t); res(true); })
      .catch(() => { clearTimeout(t); res(false); });
  });
  const ms = Math.round(performance.now() - t0);
  pingState[pk] = ok ? 'ok' : 'err';
  if (ok) pingMs[pk] = ms; else delete pingMs[pk];
  updateGlobalStatus();
  setDotState(pk, ok ? 'ok' : 'err',
    ok ? `✓ Risponde — ${ms} ms` : `✗ Non risponde (timeout ${PING_TIMEOUT / 1000} s)`);
  if (prev === 'ok' && !ok) {
    const [nome, citta] = pk.split('|');
    queueDownAlert(`${nome} (${citta}) — ${ip}`);
  }
  return ok;
}

// Quando cade un'intera rete i dispositivi smettono di rispondere tutti
// insieme: un toast per ciascuno si sovrascriveva e restava visibile solo
// l'ultimo. Si raccolgono per un attimo e si avvisa una volta sola.
let _downQueue = [], _downTimer;
function queueDownAlert(msg) {
  _downQueue.push(msg);
  clearTimeout(_downTimer);
  _downTimer = setTimeout(() => {
    const q = _downQueue; _downQueue = [];
    if (q.length === 1) return showToast('ALERT', q[0] + ' non risponde', 'err', 8000);
    const altri = q.length > 3 ? ` e altri ${q.length - 3}` : '';
    showToast('ALERT', `${q.length} dispositivi non rispondono più: ` +
      q.slice(0, 3).join(' · ') + altri, 'err', 12000);
  }, 800);
}

// Ping a partire da un pallino nel DOM: tutte le informazioni stanno nei
// data-attribute, così non serve interpolare nomi di cinema negli onclick.
function pingFromEl(el) {
  return pingDevice(el.dataset.pk, el.dataset.ip, el.dataset.port || '')
    .then(ok => {
      if (el.dataset.ck) { updateMapStatus(el.dataset.ck); updateCardHealth(el.dataset.ck); }
      return ok;
    });
}

// ── RICERCA ───────────────────────────────────────────────────
// Le card nascoste usano la classe .hidden invece di style.display, così si
// può sempre distinguere "nascosto dalla ricerca" da "nascosto da altro".
function filterDevices(q) {
  q = (q || '').toLowerCase().trim();
  const match = el => !q || el.dataset.search.includes(q);
  const soloProblemi = problemsActive();

  let visibleCinema = 0;
  document.querySelectorAll('.cinema-card[data-search]').forEach(card => {
    const show = match(card) && (!soloProblemi || !!card.querySelector('.card-body .ping-dot.err'));
    card.classList.toggle('hidden', !show);
    if (show) visibleCinema++;
  });
  document.querySelectorAll('.city-col[data-city]').forEach(col => {
    col.classList.toggle('hidden', !col.querySelector('.cinema-card:not(.hidden)'));
  });

  // Vista Per tipo: nascondi anche le intestazioni rimaste senza card e
  // ricalcola i contatori di sezione su quello che si vede davvero.
  const shown = {rtr:0, tms:0, srv:0, proj:0, aud:0};
  document.querySelectorAll('.type-card[data-search]').forEach(card => {
    const show = match(card);
    card.classList.toggle('hidden', !show);
    if (show) shown[card.closest('.model-group-cards').dataset.bucket]++;
  });
  document.querySelectorAll('.model-group-cards').forEach(wrap => {
    const empty = !wrap.querySelector('.type-card:not(.hidden)');
    wrap.classList.toggle('filtered-out', empty);
    wrap.previousElementSibling.classList.toggle('filtered-out', empty);
  });
  Object.entries(shown).forEach(([b, n]) => {
    const el = document.getElementById('count-' + b);
    if (el) el.textContent = n + ' dispositivi';
  });

  const noRes = document.getElementById('noResults');
  if (noRes) {
    noRes.style.display = (q || soloProblemi) && visibleCinema === 0 ? '' : 'none';
    noRes.textContent = soloProblemi
      ? (q ? `Nessun dispositivo offline per "${q}"` : '✓ Nessun dispositivo offline')
      : `Nessun risultato per "${q}"`;
  }
  filterMapMarkers(q);

  const clear = document.getElementById('searchClear');
  if (clear) clear.classList.toggle('show', !!q);
  syncCityIndex();
  syncTypeIndex();
  saveUiState({q});
}

// La ricerca gira su ~600 card: un filo di debounce evita di rifare tutto a
// ogni tasto premuto.
let _searchTimer;
function onSearchInput(v) {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => filterDevices(v), 120);
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  filterDevices('');
  input.focus();
}

// ── SOLO PROBLEMI ─────────────────────────────────────────────
// Il contatore "offline" della barra di stato fa da interruttore: lascia
// solo i cinema con almeno un dispositivo che non risponde. Vale solo dove
// si pinga (VPN, al chiuso, tutti): sulle reti locali non c'è niente da
// mostrare. L'elenco si riallinea a fine giro, non a ogni singolo ping,
// così le card non saltano sotto il mouse.
let _onlyProblems = false;
function pingedFilter(f) { return f === 'vpn' || f === 'chiuso' || f === 'tutti'; }
function problemsActive() { return _onlyProblems && pingedFilter(_cFilter); }

function toggleProblems(force) {
  _onlyProblems = force === undefined ? !_onlyProblems : !!force;
  const b = document.getElementById('problemsBtn');
  if (b) b.setAttribute('aria-pressed', String(_onlyProblems));
  filterDevices(document.getElementById('searchInput').value);
  if (_onlyProblems) {
    const v = document.getElementById('view-cinema');
    if (v) v.scrollTop = 0;
  }
}

// ── SALUTE DELLA CARD ────────────────────────────────────────
// Badge nell'intestazione: a card chiusa è l'unico modo di sapere se dentro
// c'è qualcosa che non risponde. Contano solo i pallini del corpo: il
// MikroTik compare anche nell'intestazione e verrebbe contato due volte.
function updateCardHealth(ck) {
  const card = document.querySelector(`#cinemasGrid .cinema-card[data-ck="${CSS.escape(ck)}"]`);
  if (!card) return;
  const badge = card.querySelector('.health');
  if (!badge) return;
  const dots = card.querySelectorAll('.card-body [data-pk]');
  let ok = 0, err = 0;
  dots.forEach(d => { if (d.classList.contains('ok')) ok++; else if (d.classList.contains('err')) err++; });
  badge.className = 'health' + (err ? ' err' : ok === dots.length && ok ? ' ok' : '');
  badge.textContent = err ? `✗ ${err} offline` : ok === dots.length && ok ? '✓ tutto ok' : '';
  badge.title = `${ok} rispondono, ${err} non rispondono, ${dots.length - ok - err} non verificati`;
}

// ── EXPORT ────────────────────────────────────────────────────
// CSV ed Excel esportano le stesse colonne e ciascuno rispetta il filtro
// della propria vista: quello che scarichi è quello che vedi.
const EXPORT_COLS = ['Cinema','Città','Rete','Sala','Dispositivo','IP','Stato'];
const NET_LABEL = {vpn:'VPN', offline:'Offline', estivi:'Estivo'};

function exportRows(cinemas) {
  const rows = [];
  cinemas.forEach(c => {
    Object.entries(c.rooms).forEach(([sala, devices]) => {
      devices.forEach(d => rows.push([
        c.name, c.city, NET_LABEL[c.net] || c.net, sala, d.label, d.ip,
        pingState[devKey(c, d.ip)] || 'non verificato',
      ]));
    });
  });
  return rows;
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ExcelJS pesa ~900 KB: si carica solo quando serve davvero.
let _exceljsPromise;
function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!_exceljsPromise) {
    _exceljsPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'vendor/exceljs.min.js';
      s.onload  = () => resolve(window.ExcelJS);
      s.onerror = () => { _exceljsPromise = null; reject(new Error('exceljs')); };
      document.head.appendChild(s);
    });
  }
  return _exceljsPromise;
}

async function downloadExcel() {
  let ExcelJSLib;
  try {
    showToast('EXCEL', 'Preparazione del file…', 'info');
    ExcelJSLib = await loadExcelJS();
  } catch (e) {
    return showToast('ERRORE', 'Libreria Excel non disponibile: usa l\'export CSV', 'err', 8000);
  }
  const wb = new ExcelJSLib.Workbook();
  wb.creator = 'SIGRA FILM — Support Tool';
  wb.created = new Date();
  const ws = wb.addWorksheet('Dispositivi');

  ws.columns = [
    {header:'Cinema',      key:'cinema',      width:32},
    {header:'Città',       key:'citta',       width:22},
    {header:'Rete',        key:'rete',        width:10},
    {header:'Sala',        key:'sala',        width:16},
    {header:'Dispositivo', key:'dispositivo', width:32},
    {header:'IP',          key:'ip',          width:22},
    {header:'Stato',       key:'stato',       width:16},
  ];

  ws.getRow(1).eachCell(cell => {
    cell.fill   = {type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3864'}};
    cell.font   = {color:{argb:'FFFFFFFF'},bold:true,size:11};
    cell.border = {bottom:{style:'thin',color:{argb:'FF4472C4'}}};
    cell.alignment = {vertical:'middle'};
  });
  ws.getRow(1).height = 20;
  ws.views = [{state:'frozen', ySplit:1}];
  ws.autoFilter = {from:'A1', to:'G1'};

  // Colore per categoria di dispositivo, non per etichetta esatta
  const FILL = {proj:'FFFFB3B3', srv:'FFFFFF99', aud:'FFFFD580', tms:'FFD6E4FF', rtr:'FFE2E2E2'};

  exportRows(getCinemasForTypeFilter()).forEach(r => {
    const row  = ws.addRow(r);
    const argb = FILL[devType(r[4])[0]];
    if (argb) row.eachCell(cell => { cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb}}; });
  });

  const buf = await wb.xlsx.writeBuffer();
  saveBlob(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
    `dispositivi-${_tFilter}.xlsx`);
}

function exportCSV() {
  const rows = [EXPORT_COLS, ...exportRows(getCinemasForFilter(_cFilter))];
  const csv  = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  saveBlob(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}), `dispositivi-${_cFilter}.csv`);
}

// ── AUTO PING ────────────────────────────────────────────────
// Id del pallino di stato dentro il marker: nome + città, altrimenti due
// cinema omonimi finirebbero sullo stesso id e si sovrascriverebbero.
function cinemaId(ck) {
  return 'ms_' + ck.replace(/[^a-zA-Z0-9]/g,'_');
}

function updateMapStatus(ck) {
  // Solo i pallini della vista Cinema: quelli nei popup mappa rispecchiano
  // gli stessi dispositivi e li conterebbero due volte.
  const allDots = [...document.querySelectorAll(
    `#cinemasGrid .ping-dot[data-ck="${CSS.escape(ck)}"]`)];
  if (!allDots.length) return;
  const el = document.getElementById(cinemaId(ck));
  if (!el) return;
  el.className = 'cmarker-status';
  // MikroTik non ancora online → nessun colore
  const rtrDot = allDots.find(d => d.dataset.rtr === '1');
  if (!rtrDot || !rtrDot.classList.contains('ok')) return;
  // MikroTik online: conta solo dispositivi cinema (no router, no TMS)
  const devDots = allDots.filter(d => !d.dataset.router);
  const okCount = devDots.filter(d => d.classList.contains('ok')).length;
  // Solo MikroTik online → rosso
  if (okCount === 0)               { el.classList.add('err');     return; }
  // Tutti i dispositivi online → verde
  if (okCount === devDots.length)  { el.classList.add('ok');      return; }
  // Alcuni sì, alcuni no → arancione
  el.classList.add('partial');
}

function openCard(hdr) {
  const card = hdr.closest('.cinema-card');
  const opening = card.classList.contains('collapsed');
  card.classList.toggle('collapsed');
  hdr.setAttribute('aria-expanded', String(opening));
  rememberCollapsed(card.dataset.ck, !opening);
  if (opening) {
    // Pinga i dispositivi mai verificati della card appena aperta
    card.querySelectorAll('.ping-dot[data-pk]').forEach(dot => {
      if (!pingState[dot.dataset.pk]) pingFromEl(dot);
    });
  }
}

let _autoPinging = false;
let _lastAutoPing = 0;

async function autoPing() {
  if (_cFilter === 'offline' || _cFilter === 'estivi') return;
  if (_autoPinging) return;            // niente giri sovrapposti
  _autoPinging = true;
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  try {
    const seen = new Set();
    const grid = document.getElementById('cinemasGrid');
    const dots = [...(grid ? grid.querySelectorAll('[data-pk]') : [])].filter(d => {
      if ((_cFilter === 'tutti' || _cFilter === 'chiuso') && !d.dataset.ip.startsWith('10.')) return false;
      if (seen.has(d.dataset.pk)) return false;
      const card = d.closest('.cinema-card');
      const isRouter = d.dataset.router === '1';
      if (card && card.classList.contains('collapsed') && !isRouter) return false;
      seen.add(d.dataset.pk);
      return true;
    });
    const pending = [];
    for (let i = 0; i < dots.length; i++) {
      if (i > 0) await new Promise(r => setTimeout(r, 80));
      pending.push(pingFromEl(dots[i]));
    }
    await Promise.all(pending);
    maybeWarnMixedContent(seen);
  } finally {
    _autoPinging = false;
    _lastAutoPing = Date.now();
    if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
    renderLastCheck();
    if (problemsActive()) filterDevices(document.getElementById('searchInput').value);
  }
}

// In HTTPS (es. GitHub Pages) il browser blocca le richieste http:// verso
// gli IP privati (mixed content) e tutti i ping falliscono. Avvisa una sola
// volta, e solo se nessun dispositivo ha risposto al giro automatico.
let _mixedWarned = false;
function maybeWarnMixedContent(checkedKeys) {
  if (_mixedWarned || location.protocol !== 'https:' || !checkedKeys.size) return;
  for (const k of checkedKeys) if (pingState[k] === 'ok') return;
  _mixedWarned = true;
  showToast('PING BLOCCATI?',
    'Nessun dispositivo risponde: verifica di essere nella VPN e che il browser ' +
    'consenta i contenuti http:// per questo sito (lucchetto → Impostazioni sito → ' +
    'Contenuti non sicuri → Consenti)', 'err', 12000);
}

// ── COPIA IP ─────────────────────────────────────────────────
function copyIP(ip, el) {
  const done = () => {
    const orig = el.dataset.ip;
    el.classList.add('copied'); el.textContent = '✓ copiato';
    setTimeout(() => { el.classList.remove('copied'); el.textContent = orig; }, 1500);
  };
  if (!navigator.clipboard) return showToast('ERRORE','Copia non disponibile','err');
  navigator.clipboard.writeText(ip).then(done)
    .catch(() => showToast('ERRORE','Copia non disponibile','err'));
}

// ── COSTRUISCE PULSANTI DISPOSITIVO ──────────────────────────
function devBtnsHTML(ip, label) {
  const [tc] = devType(label);
  const copyBtn = `<button class="ip-btn" type="button" data-ip="${ip}" title="Copia ${ip}">${ip}</button>`;
  // I Barco ICMP espongono la web UI in HTTPS sulla porta 43744
  const webUrl  = /\bicmp\b/i.test(label) ? `https://${ip}:43744/` : `http://${ip}`;
  const webBtn  = `<a class="proto-btn web" href="${webUrl}" target="_blank" rel="noopener" title="Apri interfaccia web">WEB</a>`;
  const sshBtn  = (tc === 'srv' || tc === 'rtr')
    ? `<a class="proto-btn ssh" href="ssh://${ip}" title="SSH">SSH</a>`
    : '';
  const vncBtn  = tc === 'srv'
    ? `<a class="proto-btn vnc" href="vnc://${ip}" title="VNC">VNC</a>`
    : '';
  // Tra i processori audio, solo il CP950 ha interfaccia web
  if (tc === 'aud') return (/cp950/i.test(label) ? webBtn : '') + copyBtn;
  if (tc === 'pc')  return `<a class="proto-btn vnc" href="vnc://${ip}" title="VNC">VNC</a>` + copyBtn;
  if (tc === 'tms') {
    const tmsSsh = `<a class="proto-btn ssh" href="ssh://${ip}" title="SSH">SSH</a>`;
    const tmsWeb = `<a class="proto-btn tms-web" href="http://${ip}:9000/?redirect=/tms/" target="_blank" rel="noopener" title="Apri TMS porta 9000">WEB</a>`;
    return tmsSsh + tmsWeb + copyBtn;
  }
  return vncBtn + sshBtn + webBtn + copyBtn;
}

// ── ICONA DEL CINEMA ─────────────────────────────────────────
// Stessa simbologia dei pulsanti filtro: scudo = dentro la VPN,
// lucchetto aperto = rete locale non raggiungibile, sole = arena estiva.
// Il ciak resta per i cinema al chiuso di cui non si conosce la rete
// (è l'icona usata dalla mappa pubblica).
const NET_ICON = {vpn:'🛡️', offline:'🔓', estivi:'☀️'};
function cinemaIcon(c) { return NET_ICON[c.net] || '🎬'; }

// ── PALLINO DI STATO ─────────────────────────────────────────
// Markup condiviso da vista Cinema, Per tipo e popup mappa. Tutte le
// informazioni stanno nei data-attribute e il click è gestito in
// delegazione: così non si interpolano nomi di cinema dentro gli onclick
// (molti contengono apostrofi) e lo stato già noto viene ripristinato
// quando la griglia si ricostruisce.
function dotHTML(c, dev, cls) {
  const [tc]  = devType(dev.label);
  const pk    = devKey(c, dev.ip);
  const st    = pingState[pk] || '';
  const port  = probePort(dev.label);
  const ms    = pingMs[pk];
  const title = st === 'ok'  ? `✓ Risponde${ms != null ? ' — ' + ms + ' ms' : ''}`
              : st === 'err' ? '✗ Non risponde'
              : 'Clicca per verificare raggiungibilità';
  return `<div class="${cls || 'ping-dot'}${st ? ' ' + st : ''}" role="button" tabindex="0"`
    + ` data-pk="${esc(pk)}" data-ck="${esc(cinemaKey(c))}" data-ip="${dev.ip}"`
    + ` data-cinema="${esc(c.name)}" data-city="${esc(c.city)}"`
    + (port ? ` data-port="${port}"` : '')
    + (tc === 'rtr' ? ' data-router="1" data-rtr="1"' : tc === 'tms' ? ' data-router="1"' : '')
    + ` title="${title}" aria-label="Verifica ${esc(dev.label)} ${dev.ip}"></div>`;
}

// ── CINEMA GRID (condiviso da Dashboard e Offline) ────────────
function buildCinemaGrid(cinemas, gridId, ids) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  let totalDevs = 0, totalRooms = 0;

  const cityMap = new Map();
  cinemas.forEach(c => {
    if (!cityMap.has(c.city)) cityMap.set(c.city, []);
    cityMap.get(c.city).push(c);
  });

  const buildCard = (c) => {
    const color     = cinemaColor(c.name, c.city);
    const rooms     = Object.entries(c.rooms);
    const devCount  = rooms.reduce((s,[,r]) => s+r.length, 0);
    totalDevs  += devCount;
    totalRooms += rooms.filter(([r]) => r !== 'Rete').length;
    const routerDev = rooms.flatMap(([,devs]) => devs).find(d => devType(d.label)[0] === 'rtr');
    const tmsDev    = rooms.flatMap(([,devs]) => devs).find(d => devType(d.label)[0] === 'tms');
    let roomsHTML = '';
    rooms.forEach(([roomName, devices]) => {
      roomsHTML += `<div class="room-sep">
        <div class="room-sep-dot" style="background:${color}"></div>
        <div class="room-sep-label">${esc(roomName)}</div>
        <div class="room-sep-line"></div>
      </div>`;
      devices.forEach(d => {
        roomsHTML += `<div class="dev-row">
          ${dotHTML(c, d)}
          <div class="dev-name" title="${esc(d.label)}">${esc(d.label)}</div>
          <div class="dev-btns">${devBtnsHTML(d.ip, d.label)}</div>
        </div>`;
      });
    });
    const card = document.createElement('div');
    const ck   = cinemaKey(c);
    const collapsed = _state.collapsed.includes(ck);
    card.className = 'cinema-card' + (collapsed ? ' collapsed' : '');
    card.style.cssText = `background:${color}0d;border-color:${color}55`;
    card.innerHTML = `
      <div class="card-hdr" role="button" tabindex="0" aria-expanded="${!collapsed}" style="background:linear-gradient(135deg,${color}18,${color}10)">
        <div class="card-title-block">
          <div class="card-icon" style="background:${color}20;border-color:${color}55"
            title="${c.net === 'vpn' ? 'In VPN' : c.net === 'offline' ? 'Rete locale' : 'Arena estiva'}">${cinemaIcon(c)}</div>
          <div>
            <div class="card-name">${esc(c.name)}</div>
            <div class="card-city" style="color:${color}">📍 ${esc(c.city)}</div>
            ${routerDev ? `<div class="card-rtr">
              ${dotHTML(c, routerDev)}
              <span>MikroTik&ensp;${routerDev.ip}</span>
            </div>` : ''}
          </div>
        </div>
        <div class="card-actions">
          ${tmsDev ? `<a class="proto-btn tms-web" href="http://${tmsDev.ip}:9000/?redirect=/tms/" target="_blank" rel="noopener" title="Apri TMS">TMS</a>` : ''}
          <span class="health"></span>
          <span class="tag" style="color:${color};border-color:${color}44">${devCount} host</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
      <div class="card-body">${roomsHTML}</div>`;
    card.dataset.search = [c.name, c.city,
      ...rooms.flatMap(([rn,devs]) => [rn, ...devs.map(d => d.label+' '+d.ip)])
    ].join(' ').toLowerCase();
    card.dataset.city = c.city;
    card.dataset.ck   = ck;
    return card;
  };

  cityMap.forEach((cityCinemas, city) => {
    const col = document.createElement('div');
    col.className = 'city-col';
    col.dataset.city = city;
    const hdr = document.createElement('div');
    hdr.className = 'city-col-hdr';
    hdr.innerHTML = `<div class="city-col-hdr-line"></div><span class="city-col-hdr-label">📍 ${esc(city)}</span><div class="city-col-hdr-line"></div>`;
    col.appendChild(hdr);
    const wrap = document.createElement('div');
    wrap.className = 'cinema-cards';
    cityCinemas.forEach(c => wrap.appendChild(buildCard(c)));
    col.appendChild(wrap);
    col.dataset.search = cityCinemas.flatMap(c =>
      [c.name, c.city, ...Object.entries(c.rooms).flatMap(([rn,devs]) => [rn, ...devs.map(d => d.label+' '+d.ip)])]
    ).join(' ').toLowerCase();
    grid.appendChild(col);
  });

  document.getElementById(ids.cinema).textContent  = cinemas.length;
  document.getElementById(ids.devices).textContent = totalDevs;
  document.getElementById(ids.rooms).textContent   = totalRooms;
  // Lo stato dei ping sopravvive alla ricostruzione della griglia
  cinemas.forEach(c => updateCardHealth(cinemaKey(c)));
}

// L'orario in testata è quello dell'ultimo giro di ping: prima era l'ora
// in cui era stata disegnata la griglia, che non diceva niente sullo stato.
function renderLastCheck() {
  const el = document.getElementById('lastUpdate');
  if (!el) return;
  if (!pingedFilter(_cFilter)) { el.textContent = 'rete locale · niente ping'; return; }
  if (!_lastAutoPing) { el.textContent = 'controllo in corso…'; return; }
  el.textContent = 'ultimo controllo ' +
    new Date(_lastAutoPing).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  el.title = new Date(_lastAutoPing).toLocaleString('it-IT');
}

// Cinema mostrati dalla vista Per tipo (e quindi esportati nell'Excel)
function getCinemasForTypeFilter() {

  if (_tFilter === 'offline') return DATA.offline;
  if (_tFilter === 'estivi')  return DATA.estivi;
  if (_tFilter === 'chiuso')  return [...DATA.vpn, ...DATA.offline];
  return ALL_CINEMAS;
}

function buildByType() {
  const vpnList    = DATA.vpn;
  const novpnList  = DATA.offline;
  const estiviList = DATA.estivi;
  const grids = {
    rtr:  document.getElementById('grid-rtr'),
    tms:  document.getElementById('grid-tms'),
    srv:  document.getElementById('grid-srv'),
    proj: document.getElementById('grid-proj'),
    aud:  document.getElementById('grid-aud'),
  };
  Object.values(grids).forEach(g => { if(g) g.innerHTML = ''; });

  // Collect: modelMap[bucket][normalizedLabel] = [{cinema, city, room, ip, label, novpn?}]
  const modelMap = {rtr:{}, tms:{}, srv:{}, proj:{}, aud:{}};
  const addToMap = (cinemaList, novpn=false, estate=false) => {
    cinemaList.forEach(c => {
      Object.entries(c.rooms).forEach(([room, devices]) => {
        devices.forEach(d => {
          const [tc] = devType(d.label);
          if (tc === 'pc') return;
          if (tc === 'rtr' && novpn) return;
          const buckets = (tc in modelMap) ? [tc] : ['proj'];
          const key = d.label
            .replace(/\s+e\s+(icmp|server)\b.*/i, '')
            .replace(/^(proiettore|server)\s+/gi, '')
            .trim() || d.label;
          buckets.forEach(b => {
            if (!modelMap[b][key]) modelMap[b][key] = [];
            modelMap[b][key].push({cinema: c.name, city: c.city, net: c.net, room, ip: d.ip, label: d.label, novpn, estate});
          });
        });
      });
    });
  };
  if (_tFilter === 'vpn' || _tFilter === 'tutti' || _tFilter === 'chiuso')    addToMap(vpnList,    false, false);
  if (_tFilter === 'offline' || _tFilter === 'tutti' || _tFilter === 'chiuso') addToMap(novpnList,  true,  false);
  if (_tFilter === 'estivi' || _tFilter === 'tutti')                           addToMap(estiviList, true,  true);

  const counts = {rtr:0, tms:0, srv:0, proj:0, aud:0};
  Object.entries(modelMap).forEach(([bucket, models]) => {
    const grid = grids[bucket];
    if (!grid) return;
    const sortedLabels = Object.keys(models).sort((a,b) =>
      (modelYear(a) - modelYear(b)) || a.localeCompare(b)
    );
    sortedLabels.forEach(label => {
      const entries = models[label];
      counts[bucket] += entries.length;

      // Model group header
      const imgUrl = getModelImage(label);
      const hdr = document.createElement('div');
      hdr.className = 'model-group-header';
      hdr.setAttribute('role', 'button');
      hdr.setAttribute('tabindex', '0');
      hdr.setAttribute('aria-expanded', 'true');
      hdr.dataset.bucket = bucket;
      const imgWhite = imgUrl === MODEL_IMG.sp_b || imgUrl === MODEL_IMG.nec_nc2000c;
      // entries sono dispositivi, non cinema: un modello può essere presente
      // in più sale dello stesso cinema
      const nCinema = new Set(entries.map(e => e.cinema + '|' + e.city)).size;
      hdr.innerHTML = `${imgUrl ? `<img class="mgh-img${imgWhite?' white-bg':''}" src="${imgUrl}" alt="" onerror="this.style.display='none'" loading="lazy">` : ''}<span class="mgh-label">${esc(label)}</span><span class="mgh-count">${entries.length} in ${nCinema} cinema</span><div class="mgh-line"></div><span class="mgh-chevron" aria-hidden="true">▼</span>`;
      grid.appendChild(hdr);

      // Cards container (collapsible)
      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'model-group-cards';
      cardsWrap.dataset.bucket = bucket;
      hdr.addEventListener('click', () => {
        const collapsed = hdr.classList.toggle('collapsed');
        hdr.setAttribute('aria-expanded', String(!collapsed));
        cardsWrap.classList.toggle('hidden', collapsed);
        spyType();
      });
      hdr.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hdr.click(); }
      });

      // One card per cinema/sala
      entries.forEach(e => {
        const color = cinemaColor(e.cinema, e.city);
        const card = document.createElement('div');
        card.className = 'type-card';
        card.style.cssText = `background:${color}0d;border-color:${color}44`;
        card.innerHTML = `
          <div class="tc-cinema" title="${esc(e.cinema + ' — ' + e.city)}">${esc(e.cinema)}${e.estate ? ' <span style="font-size:9px;opacity:.5;font-weight:400">· estate</span>' : e.novpn ? ' <span style="font-size:9px;opacity:.5;font-weight:400">· locale</span>' : ''}</div>
          <div class="tc-name" title="${esc(e.room)}">${esc(e.room)}</div>
          <div class="tc-btns">
            ${dotHTML({name:e.cinema, city:e.city, net:e.net}, e, 'tc-ping')}
            ${e.novpn ? '' : devBtnsHTML(e.ip, e.label)}
          </div>`;
        card.dataset.search = [e.cinema, e.city, e.room, e.label, e.ip].join(' ').toLowerCase();
        cardsWrap.appendChild(card);
      });
      grid.appendChild(cardsWrap);
    });
  });

  document.getElementById('count-rtr').textContent  = counts.rtr  + ' dispositivi';
  document.getElementById('count-tms').textContent  = counts.tms  + ' dispositivi';
  document.getElementById('count-srv').textContent  = counts.srv  + ' dispositivi';
  document.getElementById('count-proj').textContent = counts.proj + ' dispositivi';
  document.getElementById('count-aud').textContent  = counts.aud  + ' dispositivi';
}
