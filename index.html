// ── COORDS ───────────────────────────────────────────────────
// Per aggiungere un nuovo cinema: aggiungi 'Città':[lat,lng] qui sotto.
// Città non presenti appariranno al centro della Toscana come fallback.
const COORDS_VPN     = SIGRA_COORDS.vpn;
const COORDS_OFFLINE = SIGRA_COORDS.offline;
const COORDS_ESTIVI  = SIGRA_COORDS.estivi;

// ── LEAFLET MAP (condiviso da Mappa VPN e Mappa offline) ──────
async function buildLeafletMap(cinemas, {mapId, windowKey, statCinema, statHost, coords, showStatus=false}) {
  // L'attribuzione dei tile è richiesta dal provider: control compatto, senza
  // il "Leaflet" in testa.
  const map = L.map(mapId,{center:[43.5,11.2],zoom:9,zoomControl:false,
    attributionControl:false});
  window[windowKey] = map;
  // Il control va aggiunto prima del basemap: Leaflet aggancia la rimozione
  // dell'attribuzione solo ai layer aggiunti dopo di lui, altrimenti quella
  // del provider abbandonato resterebbe scritta.
  L.control.attribution({position:'bottomleft', prefix:false}).addTo(map);
  addBasemap(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  if (!window._leafletStyleDone) {
    window._leafletStyleDone = true;
    const s = document.createElement('style');
    s.textContent='.leaflet-tooltip{background:transparent !important;border:none !important;box-shadow:none !important;padding:0 !important}';
    document.head.appendChild(s);
  }

  document.getElementById(statCinema).textContent = cinemas.length;
  document.getElementById(statHost).textContent   = cinemas.reduce((s,c)=>s+Object.values(c.rooms).flat().length,0);

  // Niente raggruppamento a numeri: i marker si vedono tutti, anche quando
  // si sovrappongono. Chi cerca un cinema preciso ingrandisce e li separa.
  const marker_layer = L.layerGroup();
  const voci = _mapMarkers[mapId] = {layer: marker_layer, cinemas, items: []};

  for (let i=0; i<cinemas.length; i++) {
    const c=cinemas[i], color=cinemaColor(c.name, c.city);
    const [lat,lng]=c.coords||coords[c.city]||[43.5,11.2];
    const statusHtml = showStatus ? `<div class="cmarker-status" id="${cinemaId(cinemaKey(c))}"></div>` : '';
    const icon=L.divIcon({
      html:`<div class="cmarker" style="background:${color}20;border-color:${color};box-shadow:0 0 16px ${color}80"><div class="cmarker-inner">${cinemaIcon(c)}</div>${statusHtml}</div>`,
      className:'',iconSize:[40,40],iconAnchor:[20,40],popupAnchor:[0,-46]
    });
    const marker=L.marker([lat,lng],{icon});
    const popup=L.popup({closeButton:false,autoClose:false,closeOnClick:false}).setContent(buildPopupHTML(c));
    marker.bindPopup(popup);
    let ct;
    marker.on('mouseover',()=>{clearTimeout(ct);marker.openPopup()});
    marker.on('mouseout', ()=>{ct=setTimeout(()=>marker.closePopup(),300)});
    marker.on('popupopen',()=>{
      const el=marker.getPopup().getElement(); if(!el) return;
      // Il contenuto del popup entra nel DOM solo all'apertura: riallinea i
      // pallini allo stato corrente, che vive in pingState e non nel DOM.
      el.querySelectorAll('[data-pk]').forEach(dot=>{
        const st = pingState[dot.dataset.pk];
        dot.classList.remove('ok','err','checking');
        if (st) dot.classList.add(st);
        const ms = pingMs[dot.dataset.pk];
        if (st === 'ok')  dot.title = '✓ Risponde' + (ms != null ? ` — ${ms} ms` : '');
        if (st === 'err') dot.title = '✗ Non risponde';
      });
      el.addEventListener('mouseenter',()=>clearTimeout(ct));
      el.addEventListener('mouseleave',()=>{ct=setTimeout(()=>marker.closePopup(),300)});
    });
    marker.bindTooltip(
      `<span style="font-family:'Share Tech Mono',monospace;font-size:12px;color:${color};background:rgba(7,9,14,0.95);border:1px solid ${color}55;padding:4px 11px;border-radius:5px;white-space:nowrap;font-weight:700">${esc(c.name)}</span>`,
      {permanent:true,direction:'top',offset:[0,-42],opacity:1,className:'cinema-tooltip'}
    );
    marker_layer.addLayer(marker);
    voci.items.push({marker, ck: cinemaKey(c), search: [c.name, c.city,
      ...Object.entries(c.rooms).flatMap(([rn,devs]) => [rn, ...devs.map(d => d.label+' '+d.ip)])
    ].join(' ').toLowerCase()});
  }
  map.addLayer(marker_layer);
  filterMapMarkers(document.getElementById('searchInput').value.toLowerCase().trim());
  // I pallini di stato esistono solo dopo che i marker sono nel DOM
  if (showStatus) cinemas.forEach(c => updateMapStatus(cinemaKey(c)));
}

// La ricerca vale anche sulla mappa: restano solo i marker dei cinema che
// corrispondono e, se ne resta qualcuno, la mappa ci si centra sopra.
const _mapMarkers = {};   // mapId → {layer, cinemas, items:[{marker, ck, search}]}
function filterMapMarkers(q) {
  Object.entries(_mapMarkers).forEach(([mapId, m]) => {
    const visibili = [];
    m.items.forEach(it => {
      const show = !q || it.search.includes(q);
      const presente = m.layer.hasLayer(it.marker);
      if (show) visibili.push(it.marker);
      if (show && !presente) {
        m.layer.addLayer(it.marker);
        // L'icona viene ricreata: il pallino di stato va ricalcolato
        updateMapStatus(it.ck);
      } else if (!show && presente) m.layer.removeLayer(it.marker);
    });
    if (mapId === 'map-' + _mFilter) {
      const tot = m.items.length;
      document.getElementById('msb-cinema').textContent = q ? `${visibili.length}/${tot}` : tot;
      const map = window['_map_' + _mFilter];
      // Solo a mappa visibile: nascosta, Leaflet non ne conosce le dimensioni
      const aVista = document.getElementById('view-mappa').classList.contains('active');
      if (q && visibili.length && map && aVista) {
        map.fitBounds(L.featureGroup(visibili).getBounds().pad(0.3), {maxZoom: 13});
      }
    }
  });
}

// ── INDICE CITTÀ ──────────────────────────────────────────────
// Elenco fisso nella fascia sinistra: resta fermo mentre si scorre, porta
// alla città cliccata ed evidenzia quella che si sta guardando.
function buildCityIndex(cinemas) {
  const list = document.getElementById('cityIndexList');
  if (!list) return;
  const conteggio = new Map();
  cinemas.forEach(c => conteggio.set(c.city, (conteggio.get(c.city) || 0) + 1));
  list.innerHTML = '';
  conteggio.forEach((n, city) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ci-item';
    b.dataset.city = city;
    b.title = `${city} — ${n} cinema`;
    b.innerHTML = `<span class="ci-name">${esc(city)}</span><span class="ci-count">${n}</span>`;
    list.appendChild(b);
  });
  spyCity();
}

function scrollToCity(city) {
  const col = document.querySelector(
    `#cinemasGrid .city-col[data-city="${CSS.escape(city)}"]`);
  if (!col) return;
  // Lo scorrimento morbido su un salto lungo (l'elenco completo supera i
  // 30.000px) impiega secondi: oltre una schermata e mezza si va diretti.
  const lontano = Math.abs(col.getBoundingClientRect().top) > innerHeight * 1.5;
  col.scrollIntoView({behavior: lontano ? 'auto' : 'smooth', block:'start'});
  setActiveCity(city);
}

function setActiveCity(city) {
  // Solo le voci dell'indice città: '.ci-item' da solo prendeva anche
  // quelle dell'indice dispositivi e ne cancellava l'evidenziazione.
  document.querySelectorAll('#cityIndexList .ci-item').forEach(b => {
    const attiva = b.dataset.city === city;
    if (attiva && !b.classList.contains('active')) b.scrollIntoView({block:'nearest'});
    b.classList.toggle('active', attiva);
  });
}

// Evidenzia nell'indice la città in cima a quello che si sta guardando.
let _spyPending = false;
function spyCity() {
  if (_spyPending) return;
  _spyPending = true;
  requestAnimationFrame(() => {
    _spyPending = false;
    const cols = [...document.querySelectorAll(
      '#cinemasGrid .city-col[data-city]:not(.hidden)')];
    if (!cols.length) return setActiveCity(null);
    let corrente = cols[0];
    for (const c of cols) {
      if (c.getBoundingClientRect().top <= 140) corrente = c; else break;
    }
    setActiveCity(corrente.dataset.city);
  });
}

// Nasconde dall'indice le città che la ricerca ha svuotato.
function syncCityIndex() {
  document.querySelectorAll('#cityIndexList .ci-item').forEach(b => {
    const col = document.querySelector(
      `#cinemasGrid .city-col[data-city="${CSS.escape(b.dataset.city)}"]`);
    b.classList.toggle('hidden', !col || col.classList.contains('hidden'));
  });
  spyCity();
}

// ── INDICE DISPOSITIVI (vista Per tipo) ───────────────────────
// Stesso meccanismo dell'indice città: le sezioni fanno da intestazione e
// sotto ognuna ci sono i modelli, che portano al gruppo corrispondente.
function buildTypeIndex() {
  const list = document.getElementById('typeIndexList');
  if (!list) return;
  list.innerHTML = '';
  let n = 0;
  document.querySelectorAll('#view-bytype .type-section').forEach(sez => {
    const gruppi = [...sez.querySelectorAll('.model-group-header')];
    if (!gruppi.length) return;
    const tit = document.createElement('div');
    tit.className = 'ci-sez';
    tit.textContent = sez.querySelector('.type-title').textContent;
    tit.dataset.sezione = '1';
    list.appendChild(tit);
    gruppi.forEach(g => {
      if (!g.id) g.id = 'mg' + (++n);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ci-item ci-sotto';
      b.dataset.target = g.id;
      const etichetta = g.querySelector('.mgh-label').textContent;
      const conto = (g.querySelector('.mgh-count').textContent.match(/^\d+/) || [''])[0];
      b.title = etichetta;
      b.innerHTML = `<span class="ci-name">${esc(etichetta)}</span><span class="ci-count">${esc(conto)}</span>`;
      list.appendChild(b);
    });
  });
  spyType();
}

function scrollToTarget(id, contenitore) {
  const el = document.getElementById(id);
  if (!el) return;
  const lontano = Math.abs(el.getBoundingClientRect().top) > innerHeight * 1.5;
  el.scrollIntoView({behavior: lontano ? 'auto' : 'smooth', block:'start'});
  setActiveTarget(id);
}

function setActiveTarget(id) {
  document.querySelectorAll('#typeIndexList .ci-item').forEach(b => {
    const attiva = b.dataset.target === id;
    if (attiva && !b.classList.contains('active')) b.scrollIntoView({block:'nearest'});
    b.classList.toggle('active', attiva);
  });
}

let _spyTypePending = false;
function spyType() {
  if (_spyTypePending) return;
  _spyTypePending = true;
  requestAnimationFrame(() => {
    _spyTypePending = false;
    const gruppi = [...document.querySelectorAll(
      '#view-bytype .model-group-header:not(.filtered-out)')];
    if (!gruppi.length) return setActiveTarget(null);
    let corrente = gruppi[0];
    for (const g of gruppi) {
      if (g.getBoundingClientRect().top <= 160) corrente = g; else break;
    }
    setActiveTarget(corrente.id);
  });
}

// Nasconde dall'indice i modelli svuotati dalla ricerca, e con loro le
// sezioni rimaste senza modelli.
function syncTypeIndex() {
  const list = document.getElementById('typeIndexList');
  if (!list) return;
  let sezione = null, vuota = true;
  [...list.children].forEach(el => {
    if (el.dataset.sezione) {
      if (sezione) sezione.classList.toggle('hidden', vuota);
      sezione = el; vuota = true;
      return;
    }
    const g = document.getElementById(el.dataset.target);
    const fuori = !g || g.classList.contains('filtered-out');
    el.classList.toggle('hidden', fuori);
    if (!fuori) vuota = false;
  });
  if (sezione) sezione.classList.toggle('hidden', vuota);
  spyType();
}

// ── FILTER HELPERS ────────────────────────────────────────────
const FILTERS = ['vpn','offline','estivi','chiuso','tutti'];
const _VIEWS  = ['cinema','mappa','bytype'];
const _VIEW_LABELS = {cinema:'Cinema', mappa:'Mappa', bytype:'Per tipo'};

let _cFilter = 'vpn', _mFilter = 'vpn';
const _mapBuilt = {};

// ── STATO PERSISTENTE ────────────────────────────────────────
// Vista, filtri, ricerca e card chiuse sopravvivono al reload; l'hash
// dell'URL rende condivisibile esattamente quello che si sta guardando
// (es. #view=cinema&f=offline&q=flora).
const LS_KEY = 'sigra-support-tool/v1';
const _state = {view:'cinema', cFilter:'vpn', mFilter:'vpn', tFilter:'tutti', q:'', collapsed:[]};

function loadUiState() {
  try { Object.assign(_state, JSON.parse(localStorage.getItem(LS_KEY)) || {}); } catch (e) {}
  // L'hash vince sullo stato salvato: un link condiviso deve aprire ciò che dice
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (p.get('view')) _state.view = p.get('view');
  if (p.get('f'))    _state.cFilter = _state.mFilter = p.get('f');
  if (p.get('t'))    _state.tFilter = p.get('t');
  if (p.has('q'))    _state.q = p.get('q');
  if (!Array.isArray(_state.collapsed)) _state.collapsed = [];
  if (!_VIEWS.includes(_state.view)) _state.view = 'cinema';
  if (!FILTERS.includes(_state.cFilter)) _state.cFilter = 'vpn';
  if (!FILTERS.includes(_state.mFilter)) _state.mFilter = 'vpn';
  if (!FILTERS.includes(_state.tFilter)) _state.tFilter = 'tutti';
  if (typeof _state.q !== 'string') _state.q = '';
}

let _stateReady = false;
function saveUiState(patch) {
  Object.assign(_state, patch || {});
  if (!_stateReady) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(_state)); } catch (e) {}
  const p = new URLSearchParams();
  p.set('view', _state.view);
  if (_state.view === 'bytype')      p.set('t', _state.tFilter);
  else if (_state.view === 'mappa')  p.set('f', _state.mFilter);
  else                               p.set('f', _state.cFilter);
  if (_state.q) p.set('q', _state.q);
  history.replaceState(null, '', location.pathname + location.search + '#' + p);
}

function rememberCollapsed(ck, collapsed) {
  if (!ck) return;
  const set = new Set(_state.collapsed);
  if (collapsed) set.add(ck); else set.delete(ck);
  saveUiState({collapsed: [...set]});
}

function setActiveBtn(prefix, f) {
  FILTERS.forEach(x => {
    const b = document.getElementById(prefix + x);
    if (b) { b.classList.toggle('active', x === f); b.setAttribute('aria-pressed', String(x === f)); }
  });
}

function getCinemasForFilter(f) {
  if (f === 'vpn')     return DATA.vpn;
  if (f === 'offline') return DATA.offline;
  if (f === 'estivi')  return DATA.estivi;
  if (f === 'chiuso')  return [...DATA.vpn, ...DATA.offline].sort((a,b) => a.city.localeCompare(b.city));
  return ALL_CINEMAS.slice().sort((a,b) => a.city.localeCompare(b.city));
}

function setCinemaFilter(f) {
  _cFilter = f;
  setActiveBtn('cf-', f);
  const titles = {
    vpn:    'Cinema VPN — Dispositivi Monitorati',
    offline:'Cinema Offline — Rete Locale',
    estivi: 'Cinema Estivi ☀️',
    chiuso: 'Tutti i Cinema al Chiuso',
    tutti:  'Tutti i Cinema'
  };
  const t = document.getElementById('cinemaTitle'); if(t) t.textContent = titles[f];
  const sb = document.querySelector('.global-status-bar'); if(sb) sb.style.display = pingedFilter(f) ? '' : 'none';
  saveUiState({cFilter: f});
  buildCinema();
  filterDevices(document.getElementById('searchInput').value);
  autoPing();
}

function buildCinema() {
  const cinemas = getCinemasForFilter(_cFilter);
  buildCinemaGrid(cinemas, 'cinemasGrid', {
    cinema:'statCinema', devices:'statDevices', rooms:'statRooms'
  });
  renderLastCheck();
  buildCityIndex(cinemas);
}

async function setMapFilter(f) {
  _mFilter = f;
  setActiveBtn('mf-', f);
  saveUiState({mFilter: f});
  await showMap();
  if (f !== 'offline' && f !== 'estivi') autoPing();
}

async function showMap() {
  const f = _mFilter;
  document.querySelectorAll('.map-container').forEach(el => el.classList.remove('active'));
  document.getElementById('map-'+f).classList.add('active');
  if (!_mapBuilt[f]) {
    _mapBuilt[f] = true;
    const cinemas = getCinemasForFilter(f);
    const coords = {...COORDS_VPN, ...COORDS_OFFLINE, ...COORDS_ESTIVI};
    await buildLeafletMap(cinemas, {
      mapId:'map-'+f, windowKey:'_map_'+f,
      statCinema:'msb-cinema', statHost:'msb-host',
      coords, showStatus: f !== 'offline' && f !== 'estivi'
    });
  } else {
    const inst = window['_map_'+f];
    if (inst) setTimeout(()=>inst.invalidateSize(),50);
    const cinemas = getCinemasForFilter(f);
    document.getElementById('msb-cinema').textContent = cinemas.length;
    document.getElementById('msb-host').textContent = cinemas.reduce((s,c)=>s+Object.values(c.rooms).flat().length,0);
    filterMapMarkers(document.getElementById('searchInput').value.toLowerCase().trim());
  }
}

// ── VIEW SWITCHER ─────────────────────────────────────────────
function cycleView(){
  const cur=(document.querySelector('.view.active')||{id:'view-cinema'}).id.replace('view-','');
  switchView(_VIEWS[(_VIEWS.indexOf(cur)+1)%_VIEWS.length]);
}

function switchView(v) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.view-btn').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-selected','false')});
  document.getElementById('view-'+v).classList.add('active');
  const tab=document.getElementById('tab-'+v);
  tab.classList.add('active'); tab.setAttribute('aria-selected','true');
  const lbl=document.getElementById('viewCycleLabel');
  // Il pulsante compatto mostra la vista in cui si va, non quella attuale
  if(lbl) lbl.textContent=_VIEW_LABELS[_VIEWS[(_VIEWS.indexOf(v)+1)%_VIEWS.length]];
  saveUiState({view: v});
  // Entrando in una vista l'indice va riallineato: a vista nascosta le
  // posizioni sullo schermo sono tutte a zero e la spia non può calcolarle.
  if(v==='mappa') showMap();
  else if(v==='bytype') spyType();
  else spyCity();
}

// ── TOAST ─────────────────────────────────────────────────────
let _tt;
function showToast(title,msg,type,duration){
  const t=document.getElementById('toast'),tl=document.getElementById('toastTitle');
  tl.textContent=title;tl.className='toast-title '+(type||'info');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),duration||4000);
}

// ── INTERAZIONI (delegazione) ─────────────────────────────────
// Un solo listener per tutta la pagina: i pallini e i pulsanti portano le
// informazioni nei data-attribute, così non si interpolano nomi di cinema
// (che contengono apostrofi) dentro gli attributi onclick.
document.addEventListener('click', e => {
  const voce = e.target.closest('.ci-item');
  if (voce) {
    if (voce.dataset.target) scrollToTarget(voce.dataset.target);
    else scrollToCity(voce.dataset.city);
    return;
  }
  const dot = e.target.closest('.ping-dot,.tc-ping');
  if (dot && dot.dataset.pk) { pingFromEl(dot); return; }
  const copy = e.target.closest('.ip-btn[data-ip]');
  if (copy) { copyIP(copy.dataset.ip, copy); return; }
  if (e.target.closest('a,button')) return;   // link e pulsanti fanno il loro mestiere
  const hdr = e.target.closest('.card-hdr');
  if (hdr) openCard(hdr);
});

document.addEventListener('keydown', e => {
  const input  = document.getElementById('searchInput');
  const typing = /^(input|textarea)$/i.test(e.target.tagName);
  // "/" o Ctrl/Cmd+K portano alla ricerca, Esc la svuota
  if (!typing && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
    e.preventDefault(); input.focus(); input.select(); return;
  }
  if (e.key === 'Escape' && typing) { clearSearch(); input.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ping-dot,.tc-ping,.card-hdr')) {
    e.preventDefault(); e.target.click();
  }
});

document.getElementById('view-cinema').addEventListener('scroll', spyCity, {passive:true});
document.getElementById('view-bytype').addEventListener('scroll', spyType, {passive:true});

// ── INIT ──────────────────────────────────────────────────────
const POLL_MS = 5 * 60 * 1000;

// Applica _state all'interfaccia. Durante l'applicazione lo stato non si
// risalva (sarebbe solo un giro a vuoto sopra a se stesso).
function applyState() {
  const wasReady = _stateReady;
  _stateReady = false;
  // La ricerca va scritta nella casella prima di costruire le viste: i
  // costruttori rifiltrano leggendo da lì.
  const input = document.getElementById('searchInput');
  input.value = _state.q || '';
  setTypeFilter(_state.tFilter);
  _mFilter = _state.mFilter;
  setActiveBtn('mf-', _mFilter);
  setCinemaFilter(_state.cFilter);
  switchView(_state.view);
  _stateReady = wasReady;
}

loadUiState();
applyState();
updateGlobalStatus();
_stateReady = true;   // da qui in poi le modifiche si salvano
saveUiState();

// Un link con hash incollato in una scheda già aperta cambia solo l'hash,
// senza ricaricare: intercettalo e riapplica lo stato.
window.addEventListener('hashchange', () => {
  const before = JSON.stringify([_state.view, _state.cFilter, _state.mFilter, _state.tFilter, _state.q]);
  loadUiState();
  if (JSON.stringify([_state.view, _state.cFilter, _state.mFilter, _state.tFilter, _state.q]) === before) return;
  applyState();
});

// Il giro automatico non gira a scheda nascosta (nessuno lo sta guardando e
// ogni giro sono centinaia di fetch); al ritorno recupera se è passato troppo.
setInterval(() => { if (!document.hidden) autoPing(); }, POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - _lastAutoPing > POLL_MS) autoPing();
});
</script>
